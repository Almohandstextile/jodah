<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">اسم المستخدم:</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور:</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">دخول</button>
      <button type="button" onclick="loginAsGuest()">الدخول كزائر</button>
    </form>
    <button class="theme-toggle" onclick="toggleTheme()">تبديل الوضع الليلي/النهاري</button>
  </div>
  <script>
    // حفظ حالة الثيم
    function applyTheme() {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.body.classList.add('dark');
      } else {
        document.body.classList.remove('dark');
      }
    }
    function toggleTheme() {
      const theme = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', theme);
      applyTheme();
    }
    applyTheme();

    // بيانات المستخدم الافتراضي (يمكنك تعديلها)
    const USERS = [
      { username: 'admin', password: '1234' }
    ];

    document.getElementById('loginForm').onsubmit = function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const user = USERS.find(u => u.username === username && u.password === password);
      if (user) {
        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('username', username);
        window.location.href = 'index.html';
      } else {
        alert('بيانات الدخول غير صحيحة');
      }
    };

    function loginAsGuest() {
      localStorage.setItem('loggedIn', 'guest');
      localStorage.setItem('username', 'زائر');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
